---
- name: Install KDE Plasma and SDDM
  community.general.pacman:
    name:
      - plasma-meta
      - kde-applications-meta
      - sddm
      - konsole
      - dolphin
      - kvantum
    state: present
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Enable SDDM service
  ansible.builtin.systemd:
    name: sddm.service
    enabled: true
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Ensure KDE local share directories exist for user
  ansible.builtin.file:
    path: "/home/{{ username | default('kevin') }}/.local/share/{{ item }}"
    state: directory
    owner: "{{ username | default('kevin') }}"
    group: "{{ username | default('kevin') }}"
    mode: '0755'
  loop:
    - plasma/look-and-feel
    - plasma/desktoptheme
    - color-schemes
    - aurorae/themes
    - wallpapers
    - konsole
    - icons

- name: Extract Dracula theme tarball
  ansible.builtin.unarchive:
    src: "dracula_theme.tar.gz"
    dest: "/tmp/"
    owner: "{{ username | default('kevin') }}"
    group: "{{ username | default('kevin') }}"

- name: Move Dracula theme files into place
  ansible.builtin.shell: |
    cp -r /tmp/dracula_theme/look-and-feel/* /home/{{ username | default('kevin') }}/.local/share/plasma/look-and-feel/
    cp -r /tmp/dracula_theme/desktoptheme/* /home/{{ username | default('kevin') }}/.local/share/plasma/desktoptheme/
    cp -r /tmp/dracula_theme/color-schemes/* /home/{{ username | default('kevin') }}/.local/share/color-schemes/
    cp -r /tmp/dracula_theme/aurorae/themes/* /home/{{ username | default('kevin') }}/.local/share/aurorae/themes/
    cp -r /tmp/dracula_theme/wallpapers/* /home/{{ username | default('kevin') }}/.local/share/wallpapers/
    cp -r /tmp/dracula_theme/konsole/* /home/{{ username | default('kevin') }}/.local/share/konsole/
    cp -r /tmp/dracula_theme/icons/* /home/{{ username | default('kevin') }}/.local/share/icons/
  become: true
  become_user: "{{ username | default('kevin') }}"
  changed_when: false

- name: Ensure KDE config directory exists
  ansible.builtin.file:
    path: "/home/{{ username | default('kevin') }}/.config"
    state: directory
    owner: "{{ username | default('kevin') }}"
    group: "{{ username | default('kevin') }}"
    mode: '0755'

- name: Configure KDE globals for Dracula Theme (Dark Mode)
  community.general.ini_file:
    path: "/home/{{ username | default('kevin') }}/.config/kdeglobals"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ username | default('kevin') }}"
    group: "{{ username | default('kevin') }}"
    mode: '0644'
  loop:
    - { section: 'KDE', option: 'LookAndFeelPackage', value: 'Dracula' }
    - { section: 'General', option: 'ColorScheme', value: 'Dracula' }
    - { section: 'Icons', option: 'Theme', value: 'dracula-icons-main' }
