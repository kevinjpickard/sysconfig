---
# tasks file for basic_system_tools
- name: Install basic system utilities
  ansible.builtin.package:
    name:
      - curl
      - git
      - htop
      - vim
      - wget
      - fastfetch
    state: present

- name: Install Flatpak
  ansible.builtin.package:
    name: flatpak
    state: present

- name: Add Flathub repository
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo

- name: Install zplug
  ansible.builtin.git:
    repo: https://github.com/zplug/zplug.git
    dest: "/home/{{ username | default('kevin') }}/.zplug"
    version: master
  become: true
  become_user: "{{ username | default('kevin') }}"
