---
- name: Ensure reflector is installed
  community.general.pacman:
    name: reflector
    state: present
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Configure pacman mirrors with reflector
  ansible.builtin.command:
    cmd: reflector --latest 20 --protocol https --sort rate --save /etc/pacman.d/mirrorlist
  changed_when: false
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Install essential system packages
  community.general.pacman:
    name:
      - base-devel
      - btrfs-progs
      - curl
      - efibootmgr
      - git
      - htop
      - linux-headers
      - neovim
      - networkmanager
      - openssh
      - sudo
      - util-linux
      - wget
      - yadm
      - zsh
    state: present
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Enable NetworkManager service
  ansible.builtin.systemd:
    name: NetworkManager.service
    enabled: true
    state: started
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Enable Periodic TRIM for SSDs
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: true
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Install Virtual Machine Guest Agents
  community.general.pacman:
    name:
      - qemu-guest-agent
      - spice-vdagent
    state: present
  when: ansible_facts['distribution'] == 'Archlinux' and ansible_facts['virtualization_role'] == 'guest'

- name: Enable QEMU Guest Agent service
  ansible.builtin.systemd:
    name: qemu-guest-agent.service
    enabled: true
    state: started
  ignore_errors: true
  when: ansible_facts['distribution'] == 'Archlinux' and ansible_facts['virtualization_role'] == 'guest'

- name: Ensure target user exists
  ansible.builtin.user:
    name: "{{ username | default('kevin') }}"
    shell: /usr/bin/zsh
    create_home: true
    groups: wheel
    append: true
    state: present

- name: Ensure wheel group has sudo access
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^%wheel ALL=\(ALL:ALL\) ALL'
    line: '%wheel ALL=(ALL:ALL) ALL'
    validate: '/usr/sbin/visudo -cf %s'

- name: Check if yay is installed
  ansible.builtin.shell: command -v yay
  register: yay_check
  ignore_errors: true
  changed_when: false
  when: ansible_facts['distribution'] == 'Archlinux'

- name: Clone yay-bin repository
  ansible.builtin.git:
    repo: https://aur.archlinux.org/yay-bin.git
    dest: /tmp/yay-bin
  become: true
  become_user: "{{ username | default('kevin') }}"
  when: ansible_facts['distribution'] == 'Archlinux' and yay_check.rc != 0

- name: Build yay
  ansible.builtin.command: makepkg --cleanbuild --nodeps --force
  args:
    chdir: /tmp/yay-bin
  become: true
  become_user: "{{ username | default('kevin') }}"
  when: ansible_facts['distribution'] == 'Archlinux' and yay_check.rc != 0

- name: Install yay package
  ansible.builtin.shell: pacman -U --noconfirm *.pkg.tar.zst
  args:
    chdir: /tmp/yay-bin
  become: true
  when: ansible_facts['distribution'] == 'Archlinux' and yay_check.rc != 0
