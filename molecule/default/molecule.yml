---
dependency:
  name: galaxy
  options:
    role-file: ansible/requirements.yml

driver:
  name: docker

platforms:
  - name: archlinux-test
    image: archlinux:latest
    pre_build_image: true
    privileged: true
    command: /usr/lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host

provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/ansible/roles
  inventory:
    group_vars:
      all:
        username: testuser
  playbooks:
    converge: converge.yml

verifier:
  name: ansible

scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - destroy
